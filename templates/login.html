
{% extends "base.html" %}

{% block title %}Login | TrustVault{% endblock %}

{% block content %}
<div style="max-width: 480px; margin: 10px auto;">
    <div class="content-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="font-size: 42px;" aria-hidden="true">🔐</div>
            <h1 style="font-size: 32px; margin: 10px 0;">
                Welcome Back
            </h1>
            <p style="color: var(--muted); margin: 0;">
                Sign in to access your secure workspace.
            </p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="username"
                    maxlength="254"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button class="btn" type="submit" style="width: 100%;">
                Sign In →
            </button>
        </form>

        <p style="text-align: center; margin-top: 22px;">
            New to TrustVault?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
