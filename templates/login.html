
{% extends "base.html" %}

{% block title %}Login | TrustVault{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Welcome Back</h1>
    <p class="muted">Sign in to access your TrustVault dashboard.</p>

    <form method="POST" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >

        <button class="button" type="submit">Login</button>
    </form>

    <p class="muted">
        Don't have an account?
        <a href="{{ url_for('register') }}">Create one</a>
    </p>
</section>
{% endblock %}
