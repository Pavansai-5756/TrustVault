
{% extends "base.html" %}

{% block title %}Create Account | TrustVault{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 10px auto;">
    <div class="content-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="font-size: 42px;" aria-hidden="true">🔐</div>
            <h1 style="font-size: 32px; margin: 10px 0;">
                Create Account
            </h1>
            <p style="color: var(--muted); margin: 0;">
                Join TrustVault to manage your documents securely.
            </p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    maxlength="254"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 12 characters"
                    autocomplete="new-password"
                    minlength="12"
                    required
                >
                <small style="color: var(--muted);">
                    Use at least 12 characters. Never reuse an important password.
                </small>
            </div>

            <button class="btn" type="submit" style="width: 100%;">
                Create Secure Account →
            </button>
        </form>

        <p style="text-align: center; margin-top: 22px;">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
