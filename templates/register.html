
{% extends "base.html" %}

{% block title %}Register | TrustVault{% endblock %}

{% block content %}
<section class="form-card">
    <h1>Create Account</h1>
    <p class="muted">Create your TrustVault account to get started.</p>

    <form method="POST" action="{{ url_for('register') }}">
        <input type="hidden" name="csrf_token"
               value="{{ csrf_token() }}">

        <label for="name">Full Name</label>
        <input
            type="text"
            id="name"
            name="name"
            maxlength="100"
            autocomplete="name"
            required
        >

        <label for="email">Email Address</label>
        <input
            type="email"
            id="email"
            name="email"
            maxlength="254"
            autocomplete="email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            minlength="12"
            autocomplete="new-password"
            required
        >

        <button class="button" type="submit">Create Account</button>
    </form>

    <p class="muted">
        Already registered?
        <a href="{{ url_for('login') }}">Sign in</a>
    </p>
</section>
{% endblock %}
